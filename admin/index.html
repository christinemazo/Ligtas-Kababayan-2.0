<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ligtas Kababayan – Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    [hidden]{display:none !important} /* so display:flex/grid rules can never un-hide something */
    .wrap{max-width:900px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
    .acts{display:flex;gap:8px;margin-top:8px}
    .acts .btn{padding:10px}
    .sh input{width:90px;margin:0}
    #map{height:340px;border-radius:14px;border:1px solid var(--bd);margin:10px 0 4px}
    .rp{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
    .rp.v{background:#e0312b}
    .rp.n{background:#0b3a63}
    .rp.ack{opacity:.5}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px}
    .card.hl{outline:3px solid var(--sos)}
    summary{cursor:pointer}
    details[open] summary{margin-bottom:6px}
    #bf,#sb{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;margin:6px 0 10px;background:#fff;color:var(--tx)}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="login" class="card" hidden>
      <h2>Admin login</h2>
      <label for="em">Email</label><input id="em" type="email" autocomplete="username">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
      <p id="err" style="color:#e0312b"></p>
      <button class="btn" id="go" style="margin-top:8px">Sign in</button>
    </div>
    <div id="dash" hidden>
      <div class="row"><h2 id="who">Barangay dashboard</h2><button class="btn sec" id="out" style="width:auto">Sign out</button></div>

      <!-- super admin only: switch between the per-barangay overview and the live reports -->
      <div id="tabs" class="acts" hidden>
        <button class="btn" id="tab-ov">Barangay overview</button>
        <button class="btn sec" id="tab-rp">Reports &amp; evacuation centers</button>
      </div>

      <!-- super admin only: overview with one card per barangay -->
      <div id="ov" hidden>
        <details id="addsh" class="card" hidden>
          <summary><b>Add evacuation center</b></summary>
          <label for="sn">Name</label><input id="sn" type="text" maxlength="80" placeholder="e.g. Obrero Elementary School">
          <label for="sb">Barangay</label><select id="sb"></select>
          <label for="sc">Capacity (people)</label><input id="sc" type="number" min="1">
          <p id="serr" style="color:#e0312b"></p>
          <button class="btn" id="sadd" style="margin-top:8px">Add center</button>
        </details>
        <p id="ovsum"></p>
        <div id="ovg" class="grid"></div>
      </div>

      <!-- reports, map and evacuation centers (barangay admins see only this part) -->
      <div id="main">
        <p>Vulnerable queue first. Each list is sorted by water level. New reports appear instantly.</p>
        <select id="bf" aria-label="Filter by barangay" hidden></select>
        <div id="mapwrap">
        <div id="map"></div>
        <p style="font-size:13px"><span class="dot" style="background:#e0312b;margin-left:0"></span>Vulnerable<span class="dot" style="background:#0b3a63"></span>Normal<span class="dot" style="background:#aab7c3"></span>Faded = acknowledged</p>
        </div>
        <div class="grid"><div><h3>Vulnerable queue</h3><div id="v"></div></div><div><h3>Normal queue</h3><div id="n"></div></div></div>
        <h3>Evacuation center occupancy</h3><div id="sh"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
