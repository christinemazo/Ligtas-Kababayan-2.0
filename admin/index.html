<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ligtas Kababayan – Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script>
    // apply the saved light/dark choice before the page paints (no flash)
    try { document.documentElement.dataset.theme = localStorage.getItem("lk-theme") || "dark"; } catch {}
  </script>
</head>
<body>
  <!-- sign-in screen -->
  <div id="login" class="login" hidden>
    <div class="card login-card">
      <h2>Admin login</h2>
      <p>Ligtas Kababayan · barangay and city admins</p>
      <label for="em">Email</label><input id="em" type="email" autocomplete="username">
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
      <p id="err" style="color:#e0312b"></p>
      <button class="btn" id="go" style="margin-top:8px">Sign in</button>
    </div>
  </div>

  <!-- dashboard: main.js picks the role, then shell.js draws the sidebar, top bar and pages here -->
  <div id="app" hidden></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
